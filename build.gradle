plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
	// Only its ShadowJar task is used, to give Cobalt (the Lua VM) our own package name.
	id 'com.gradleup.shadow' version '9.6.1' apply false
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	maven {
		url = "https://maven.squiddev.cc"
		content {
			includeGroup("cc.tweaked")
		}
	}
}

configurations {
	cobalt
}

// Cobalt is CC: Tweaked's Lua VM (MIT). It is renamed into our package and packed into our jar, so it
// never clashes with the Cobalt that CC: Tweaked brings along, whatever versions the two are.
def relocatedCobalt = tasks.register('relocatedCobalt', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
	configurations = [project.configurations.cobalt]
	relocate 'org.squiddev.cobalt', 'de.knito.billboard.api.lua.cobalt'
	relocate 'cc.tweaked.cobalt', 'de.knito.billboard.api.lua.cobalt.internal'
	exclude 'module-info.class', 'META-INF/**'
	archiveFileName = 'cobalt-relocated.jar'
	destinationDirectory = layout.buildDirectory.dir('cobalt')
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"billboard_api" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// Only Fabric API runs with the mod in IDEA and runClient/runServer. Other mods for testing
// (CC: Tweaked, ...) go as jar files into run/mods; the ones below are compiled against only.
dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// The Lua Box's VM, renamed by the relocatedCobalt task and packed into our jar.
	cobalt("cc.tweaked:cobalt:${project.cobalt_version}") { transitive = false }
	implementation files(relocatedCobalt)

	// CC: Tweaked is optional: compiled against for the peripheral bridge, but not needed at runtime.
	compileOnly("cc.tweaked:cc-tweaked-${project.minecraft_version}-core-api:${project.cc_tweaked_version}") { transitive = false }
	compileOnly("cc.tweaked:cc-tweaked-${project.minecraft_version}-fabric-api:${project.cc_tweaked_version}") { transitive = false }

}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
	from(relocatedCobalt.flatMap { it.archiveFile }.map { zipTree(it) })
	from("THIRD_PARTY_NOTICES.md")
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
