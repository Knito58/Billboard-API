# Builds the mod and publishes a GitHub release for the version in gradle.properties.
# Then uploads the jar to CurseForge (curseforge.yml). Start it with "Run workflow" on the Actions tab, or by pushing a tag v<version>.
name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Read the mod version
        id: version
        run: |
          version=$(grep '^version=' gradle.properties | cut -d= -f2)
          echo "TAG=v$version" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version=$version in gradle.properties"
            exit 1
          fi
      - name: Build
        run: ./gradlew build --no-configuration-cache
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Billboard API ${{ env.VERSION }} for Minecraft 26.3
          body_path: CHANGELOG.md
          files: |
            build/libs/billboard-api-*.jar
            !build/libs/billboard-api-*-sources.jar

  curseforge:
    needs: release
    uses: ./.github/workflows/curseforge.yml
    with:
      tag: v${{ needs.release.outputs.version }}
    secrets: inherit
